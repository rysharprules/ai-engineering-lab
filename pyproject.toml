[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-lab"
version = "0.1.0"
description = "Practical experiments in language models and AI engineering"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "transformers>=4.46,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
